name: Deploy Wiki e Slides

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Marp Slides (Apresentações)
        run: |
          mkdir -p public/slides
          npx -y @marp-team/marp-cli@latest content/Aulas/*.md -o public/slides/
          echo "Slides Marp gerados:"
          ls public/slides/

      - name: Build Quartz (Wiki)
        run: npx quartz build

      - name: Copiar Reveal.js de static/slides para public/slides
        run: |
          mkdir -p public/slides
          cp static/slides/*.html public/slides/ 2>/dev/null || true
          echo "Todos os slides em public/slides/:"
          ls public/slides/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
