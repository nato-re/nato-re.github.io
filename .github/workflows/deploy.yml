name: Deploy Wiki e Slides

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Marp Slides (Apresentações)
        run: |
          npx -y @marp-team/marp-cli@latest -I content/Aulas/ -o content/Aulas/

      - name: Build Quartz (Wiki + Slides)
        run: npx quartz build

      - name: Mover slides para public/slides/
        run: |
          mkdir -p public/slides
          find content/Aulas/ -name "*.html" -exec cp {} public/slides/ \;
          echo "Slides gerados:"
          ls public/slides/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
