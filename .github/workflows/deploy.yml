name: Deploy Wiki e Slides

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz (Wiki)
        run: npx quartz build

      - name: Build Marp Slides + Copiar Reveal.js
        run: |
          mkdir -p public/slides
          npx -y @marp-team/marp-cli@latest \
            --input-dir content/Aulas/ \
            --output public/slides/ \
            --allow-local-files
          cp static/slides/*.html public/slides/ 2>/dev/null || true
          echo "Todos os slides em public/slides/:"
          ls public/slides/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
